<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Textmikroskop Philosophie · V3</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#18202b;--muted:#657184;--line:#dfe5ee;--blue:#315fbd;--soft:#edf3ff;--green:#eaf7ef;--amber:#fff4d9;--rose:#fbeaf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1;margin:.2em 0}.lead{color:var(--muted);max-width:850px}.top,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.modes{margin:15px 0}.mode{background:#fff;border:1px solid var(--line);color:var(--ink)}.mode.active{background:var(--blue);color:white}textarea{width:100%;min-height:270px;border:1px solid var(--line);border-radius:13px;padding:14px;font:inherit;resize:vertical}button{border:0;border-radius:11px;padding:10px 15px;font:inherit;font-weight:700;background:var(--blue);color:white;cursor:pointer}button.alt{background:#eef1f6;color:var(--ink)}button.reveal{margin-top:10px;background:#eef1f6;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5}.status{color:var(--muted);margin-top:10px}.hidden{display:none}.head{font-size:1.12rem;font-weight:800;margin-bottom:10px}.item{padding:11px 13px;background:#f7f9fc;border-radius:11px;margin:8px 0}.simple{font-size:1.08rem;background:var(--soft);padding:16px;border-radius:13px}.example{background:var(--green)}.task{border-left:4px solid var(--blue);background:var(--soft);padding:14px;border-radius:10px;margin:12px 0}.solution{margin-top:12px}.glossary{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.q1{background:var(--soft)}.q2{background:var(--amber)}.q3{background:var(--rose)}.badge{display:inline-block;font-size:.75rem;font-weight:800;padding:2px 7px;border-radius:999px;background:#fff;margin-right:6px}details{border-top:1px solid var(--line);margin-top:9px;padding-top:9px}summary{cursor:pointer;font-weight:700}.login{max-width:470px;margin:60px auto}.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:8px 0}.stepnote{color:var(--muted);font-size:.94rem}.quote{border-left:3px solid var(--line);padding-left:10px;margin:8px 0;color:#39465a}@media(max-width:650px){main{padding:14px 10px 40px}.top,.card{border-radius:14px;padding:14px}textarea{min-height:230px}}

.interactive-text{display:flex;flex-wrap:wrap;gap:5px;line-height:1.9;margin:14px 0;padding:14px;border:1px solid #d8dde5;border-radius:12px;background:#fff}
.token{border:1px solid transparent;border-radius:6px;padding:2px 5px;cursor:pointer;user-select:none;touch-action:manipulation}
.token:hover{border-color:#9aa7b8}.token.selected{background:#dcecff;border-color:#6c94c4}.token.correct{background:#dff3e4;border-color:#6ea47a}.token.missed{background:#fff0c9;border-color:#c59b35}.token.wrong{background:#f8dddd;border-color:#bd7373}
.feedback{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f4f6f8}.practice-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.practice-actions button{width:auto}.hint{font-size:.94rem}
</style></head><body><main>
<section id="login" class="top login"><h1>Textmikroskop</h1><p class="lead">Geschützter Zugang zur Philosophie-Analyse.</p><input id="password" type="password" placeholder="Zugangscode"><button id="loginBtn">Anmelden</button><div id="loginStatus" class="status"></div></section>
<div id="app" class="hidden"><h1>Philosophische Texte verstehen</h1><p class="lead">V3 führt dich vom ersten Zugang zurück in den Originaltext: erst selbst untersuchen, dann mit der Lösung vergleichen.</p><section class="top"><div class="row modes"><button class="mode active" data-mode="student">Schüleransicht</button><button class="mode" data-mode="teacher">Lehreransicht</button></div><textarea id="text" placeholder="Philosophischen Originaltext hier einfügen …"></textarea><div class="row" style="margin-top:10px"><button id="analyse">Mit KI analysieren</button><button id="kant" class="alt">Kant-Beispiel</button><button id="clear" class="alt">Leeren</button></div><div id="status" class="status"></div></section><div id="results"></div></div>
</main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),arr=v=>Array.isArray(v)?v:[];let mode="student";
const kant=`Begehrungsvermögen ist das Vermögen, durch seine Vorstellungen Ursache der Gegenstände dieser Vorstellungen zu sein. Das Vermögen eines Wesens, seinen Vorstellungen gemäß zu handeln, heißt das Leben.\nMit dem Begehren oder Verabscheuen ist erstlich jederzeit Lust oder Unlust, deren Empfänglichkeit man Gefühl nennt, verbunden, aber nicht immer umgekehrt. Denn es kann eine Lust geben, welche mit gar keinem Begehren des Gegenstandes, sondern mit der bloßen Vorstellung, die man sich von einem Gegenstande macht, schon verknüpft ist. Auch geht, zweitens, nicht immer die Lust oder Unlust an dem Gegenstande des Begehrens vor dem Begehren vorher und darf nicht allemal als Ursache, sondern kann auch als Wirkung desselben angesehen werden.`;
function card(title,body){return `<section class="card"><div class="head">${title}</div>${body}</section>`}function reveal(id){const el=document.getElementById(id);el.classList.remove("hidden");document.querySelector(`[data-target="${id}"]`)?.classList.add("hidden")}

function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\p{L}\p{N}]+/gu," ").trim()}
function tokens(text){return String(text||"").match(/\S+/g)||[]}
function interactiveText(text,id){return `<div id="${id}" class="interactive-text">${tokens(text).map((w,i)=>`<span class="token" data-i="${i}" onclick="this.classList.toggle('selected')">${esc(w)}</span>`).join("")}</div>`}
function expectedIndices(text,answers,field){const ts=tokens(text),out=new Set();arr(answers).forEach(a=>{const phrase=norm(a?.[field]);if(!phrase)return;const ps=phrase.split(/\s+/);for(let i=0;i<ts.length;i++){for(let len=Math.max(1,ps.length-2);len<=ps.length+2;len++){if(norm(ts.slice(i,i+len).join(" "))===phrase){for(let j=i;j<i+len;j++)out.add(j)}}}});return out}
function checkPractice(id,text,answers,field,fbid){const box=$("#"+id),sel=new Set([...box.querySelectorAll(".token.selected")].map(x=>+x.dataset.i)),exp=expectedIndices(text,answers,field);box.querySelectorAll(".token").forEach(x=>{const i=+x.dataset.i;x.classList.remove("correct","wrong","missed");if(sel.has(i)&&exp.has(i))x.classList.add("correct");else if(sel.has(i)&&!exp.has(i))x.classList.add("wrong")});const hit=[...sel].filter(i=>exp.has(i)).length,precision=sel.size?hit/sel.size:0,recall=exp.size?hit/exp.size:0,score=(precision+recall)?2*precision*recall/(precision+recall):0;let msg;if(!sel.size)msg="Markiere zuerst eine oder mehrere Stellen im Originaltext.";else if(score>=.78)msg="Sehr gut: Deine Markierung trifft die Musterlösung weitgehend. Andere plausible Grenzziehungen können ebenfalls sinnvoll sein.";else if(score>=.45)msg="Teilweise getroffen. Prüfe besonders, ob du den ganzen Gedankenschritt erfasst hast und wo ein neuer Gedanke beginnt.";else msg="Noch einmal prüfen. Achte auf Wechsel wie Behauptung → Begründung, Gegensatz oder Folgerung.";$("#"+fbid).innerHTML=msg}
function hintPractice(kind,n){const id=kind==="units"?"fb-units":"fb-con";const hints=kind==="units"?["Achte auf Stellen, an denen sich die Funktion eines Satzteils ändert.","Suche besonders nach Begründungen, Unterscheidungen, Einwänden und Folgerungen."]:["Suche zunächst nach Wörtern wie weil, denn, aber, wenn, also, daher oder dennoch.","Nicht jede logische Beziehung wird ausdrücklich genannt. Markiere zunächst die sichtbaren Verbindungswörter."];$("#"+id).innerHTML=`<span class="hint"><b>Hinweis:</b> ${hints[Math.min(n-1,hints.length-1)]}</span>`}

function render(d){const z=d.zugang||{},syn=d.synthese||{},original=$("#text").value.trim();const gloss=arr(d.glossar).map(x=>{x=x||{};return `<div class="item"><b>${esc(x.begriff)}</b><br>${esc(x.einfach)}<br><small>${esc(x.im_text)}</small></div>`}).join("");const units=arr(d.gedankenschritte).map(x=>{x=x||{};return `<div class="item"><b>${esc(x.nr)} · ${esc(x.funktion)}</b><div class="quote">${esc(x.textstelle)}</div>${esc(x.erklaerung)}</div>`}).join("");const con=arr(d.konnektoren).map(x=>{x=x||{};return `<div class="item"><b>${esc(x.ausdruck)}</b> → ${esc(x.beziehung)}<br>${esc(x.erklaerung)}</div>`}).join("");const arg=arr(d.argumentationslogik).map((x,i)=>{x=x||{};return `<div class="item"><b>${esc(x.rolle)}</b>${i<arr(d.argumentationslogik).length-1?" →":""}<br>${esc(x.aussage)}</div>`}).join("");const map=arr(z.zuordnung).map(x=>{x=x||{};return `<div style="margin-top:9px"><b>${esc(x.im_beispiel)}</b> → <b>${esc(x.im_text)}</b><br>${esc(x.erklaerung)}</div>`}).join("");const qs=arr(d.fragen).map(x=>{x=x||{};return `<div class="item q${x.afb==="I"?1:x.afb==="II"?2:3}"><span class="badge">AFB ${esc(x.afb)}</span>${esc(x.frage)}${mode==="teacher"?`<details><summary>Erwartung anzeigen</summary>${esc(x.erwartung)}</details>`:""}</div>`}).join("");
$("#results").innerHTML=
card("1 · Welches Problem steckt im Text?",`<p>${esc(d.problem)}</p>`)+
card("2 · Erster Zugang zum Gedanken",`<div class="simple"><b>Ganz einfach gesagt</b><br><br>${esc(z.einfach)}</div><div class="item example"><b>Stell dir vor …</b><br><br>${esc(z.beispiel)}</div><details><summary>Was hat das Beispiel mit dem Text zu tun?</summary>${map}</details><details><summary>Wo hinkt das Beispiel?</summary>${esc(z.grenze)}</details>`)+
card("3 · Zurück zum Original: Gedankenschritte markieren",`<div class="task"><b>Deine Aufgabe:</b> Tippe oder klicke auf die Wörter, die zu den entscheidenden Gedankenschritten gehören. Markiere möglichst zusammenhängende Passagen. Danach kannst du deine Auswahl prüfen.</div>${interactiveText(original,"practice-units")}<div class="practice-actions"><button onclick="checkPractice('practice-units',${JSON.stringify(original)},window.lastData.gedankenschritte,'textstelle','fb-units')">Markierung prüfen</button><button class="reveal" onclick="hintPractice('units',1)">Hinweis</button><button class="reveal" data-target="solution-units" onclick="reveal('solution-units')">Musterlösung</button></div><div id="fb-units" class="feedback">Noch keine Markierung geprüft.</div><div id="solution-units" class="solution hidden">${units}</div>`)+
card("4 · Konnektoren im Original finden",`<div class="task"><b>Deine Aufgabe:</b> Markiere Wörter oder Wendungen, die Gedanken logisch miteinander verbinden. Prüfe anschließend deine Auswahl.</div>${interactiveText(original,"practice-con")}<div class="practice-actions"><button onclick="checkPractice('practice-con',${JSON.stringify(original)},window.lastData.konnektoren,'ausdruck','fb-con')">Konnektoren prüfen</button><button class="reveal" onclick="hintPractice('con',1)">Hinweis</button><button class="reveal" data-target="solution-con" onclick="reveal('solution-con')">Musterlösung</button></div><div id="fb-con" class="feedback">Noch keine Markierung geprüft.</div><div id="solution-con" class="solution hidden">${con}</div>`)+
card("5 · Argumentationslogik rekonstruieren",`<p class="stepnote">Jetzt werden die einzelnen Schritte zu einem Argumentationsgang zusammengesetzt.</p>${arg}`)+
card("Glossar · Hilfe beim Originaltext",`<p class="stepnote">Das Glossar ist ein Hilfsmittel. Nutze es, wenn ein Begriff den Zugang zum Originaltext erschwert.</p><div class="glossary">${gloss}</div>`)+
card("6 · Was sagt der Text insgesamt?",`<div class="item"><b>Problem</b><br>${esc(syn.problem)}</div><div class="item"><b>Antwort des Autors</b><br>${esc(syn.antwort)}</div><div class="item"><b>Argumentationsweg</b><br>${esc(syn.argumentationsweg)}</div><div class="item"><b>Philosophisch präzise</b><br>${esc(syn.philosophisch)}</div><div class="simple"><b>In einfacher Sprache</b><br><br>${esc(syn.einfach)}</div><p><b>Merksatz:</b> ${esc(syn.merksatz)}</p>`)+
card("7 · Selbst prüfen",qs)}
async function login(){$("#loginStatus").textContent="Prüfe Zugang …";const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#password").value})});if(r.ok){$("#login").classList.add("hidden");$("#app").classList.remove("hidden");$("#status").textContent="Bereit."}else $("#loginStatus").textContent="Zugangscode nicht korrekt."}$("#loginBtn").onclick=login;$("#password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x===b));if(window.lastData)render(window.lastData)});$("#kant").onclick=()=>$("#text").value=kant;$("#clear").onclick=()=>{$("#text").value="";$("#results").innerHTML=""};
$("#analyse").onclick=async()=>{const text=$("#text").value.trim();if(!text){$("#status").textContent="Bitte zuerst einen Text einfügen.";return}$("#analyse").disabled=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),180000),started=Date.now(),ticker=setInterval(()=>{$("#status").textContent=`KI analysiert … ${Math.round((Date.now()-started)/1000)} s`},1000);$("#status").textContent="KI analysiert … 0 s";try{const r=await fetch("/api/analyse",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text}),signal:controller.signal});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw new Error("Der Server hat keine gültige Antwort geliefert.")}if(!r.ok)throw new Error(d.error||`Analyse fehlgeschlagen (HTTP ${r.status})`);window.lastData=d;render(d);$("#status").textContent=`V4 fertig. Heute noch ${d._meta?.remaining??"?"} Analysen verfügbar.`}catch(e){$("#status").textContent=e.name==="AbortError"?"Die Analyse dauert länger als 3 Minuten und wurde abgebrochen.":`Fehler: ${e.message}`}finally{clearTimeout(timeout);clearInterval(ticker);$("#analyse").disabled=false}};
</script></body></html>
